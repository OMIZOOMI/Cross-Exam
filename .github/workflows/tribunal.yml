name: Tribunal trust boundary

on:
  push:
    branches: ["feature/stage14-explorer-breaker", "feature/stage14c-controlled-provider", "feature/stage15-skeptic-offline", "feature/stage16-reproducer-offline", "feature/stage16b-controlled-reproducer-offline", "feature/stage16b1-fixture-preflight"]

permissions:
  contents: read

concurrency:
  group: tribunal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:skeptic
      - run: pnpm test:reproducer
      - run: pnpm test:controlled-reproducer
      - run: pnpm test:fixture-preflight
      - run: pnpm test:tribunal
      - run: pnpm test:provider
      - run: pnpm test:provider-ledger
      - run: pnpm test:provider-operator
      - run: pnpm test
      - run: pnpm build
