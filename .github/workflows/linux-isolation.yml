name: Linux browser isolation

on:
  push:
    branches: [main, "validation/**", "feature/browser-evidence-collector"]
  pull_request:
    paths:
      - "apps/browser-worker/**"
      - "packages/engine/src/browser-egress/**"
      - "tests/linux-isolation/**"
      - "scripts/linux-isolation-harness.ts"
      - "scripts/prepare-linux-isolation.sh"
      - ".github/workflows/linux-isolation.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: linux-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update
      - run: sudo apt-get install --yes systemd dbus-user-session iproute2 apparmor apparmor-utils
      - run: pnpm lint
      - run: pnpm --filter @crossexam/browser-worker typecheck
      - run: bash scripts/prepare-linux-isolation.sh
      - name: Provision exact Chromium AppArmor userns policy
        id: apparmor
        run: sudo -n "$(command -v node)" node_modules/tsx/dist/cli.mjs scripts/provision-chromium-apparmor.ts install
      - name: Run owned Linux isolation fixtures
        run: sudo -n "$(command -v node)" node_modules/tsx/dist/cli.mjs scripts/linux-isolation-harness.ts
      - name: Remove temporary Chromium AppArmor policy
        if: always() && steps.apparmor.outcome == 'success'
        run: sudo -n "$(command -v node)" node_modules/tsx/dist/cli.mjs scripts/provision-chromium-apparmor.ts cleanup
