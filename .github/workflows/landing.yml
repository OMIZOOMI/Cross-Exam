name: Veyra cinematic landing

on:
  push:
    branches: ["feature/stage18-1-cinematic-landing", "feature/stage18-2-video-ad"]

permissions:
  contents: read

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Install isolated film authoring tool
        run: pnpm --dir tools/veyra-film install --frozen-lockfile
      - run: pnpm film:typecheck
      - run: pnpm lint
      - name: Validate the synthetic landing source
        run: pnpm test:landing
      - name: Root and workspace typecheck, then production build
        run: pnpm build
      - name: Install UI test browser only
        run: pnpm exec playwright install --with-deps chromium
      - name: Landing-only desktop and mobile checks
        run: pnpm exec playwright test -c landing-video.config.ts
